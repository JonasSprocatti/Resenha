<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resenha</title>
<meta name="description" content="Seis jogos de festa num celular só: Quem Sou Eu?, Mímica, Palavra Proibida, Impostor, Na Medida e Stop.">
<meta name="theme-color" content="#EDEFF6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121428" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Resenha">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--paper,#EDEFF6)}
body{margin:0}
img{max-width:100%}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=Permanent+Marker&display=swap">
<style>
/* Layout: a desk of post-its. Home is a wall of game notes; a round fills the whole screen with one note held to the forehead or passed around. */
:root{
  --paper:#EDEFF6;
  --surface:#FFFFFF;
  --ink:#1A1D38;
  --muted:#565B80;
  --line:#D3D6E6;
  --ok-soft:rgba(20,166,83,.16);
  --note-ink:#1A1D38;
  --note-veil:rgba(255,255,255,.5);
  --note-shade:rgba(26,29,56,.1);
  --ruler-bg:rgba(255,255,255,.82);
  --yellow:#FFE15A;
  --pink:#FF9DC2;
  --blue:#86CDFF;
  --green:#96E3A3;
  --orange:#FFB36B;
  --lilac:#C9B6FF;
  --ok:#13A452;
  --skip:#EC7130;
  --bad:#D93C46;
  --on-strong:#FFFFFF;
  --focus:#2F6BFF;
  --shadow:0 1px 0 rgba(26,29,56,.05), 0 12px 24px -14px rgba(26,29,56,.45);
  --f-display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-marker:'Permanent Marker','Marker Felt','Chalkboard SE','Bricolage Grotesque',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121428; --surface:#1B1E3A; --ink:#ECEDF8; --muted:#A3A7CB; --line:#2E3259;
    --ok-soft:rgba(46,200,110,.2); --focus:#8FB0FF;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 16px 30px -16px rgba(0,0,0,.85);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121428; --surface:#1B1E3A; --ink:#ECEDF8; --muted:#A3A7CB; --line:#2E3259;
  --ok-soft:rgba(46,200,110,.2); --focus:#8FB0FF;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 16px 30px -16px rgba(0,0,0,.85);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body.playing{overflow:hidden}
[data-c="yellow"]{--c:var(--yellow)} [data-c="pink"]{--c:var(--pink)} [data-c="blue"]{--c:var(--blue)} [data-c="green"]{--c:var(--green)} [data-c="orange"]{--c:var(--orange)} [data-c="lilac"]{--c:var(--lilac)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 56px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 4px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;background:none;border:0;cursor:pointer;padding:4px 0}
.brand-mark{width:30px;height:30px;background:var(--yellow);color:var(--note-ink);display:grid;place-items:center;font-family:var(--f-marker);font-size:19px;line-height:1;transform:rotate(-7deg);box-shadow:var(--shadow);border-radius:2px}
.tb-actions{display:flex;gap:8px}
.btn-ghost{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px;line-height:1;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer}
.btn-ghost svg{flex:none}
.badge{background:var(--ink);color:var(--paper);border-radius:99px;font-size:12px;padding:3px 7px;font-variant-numeric:tabular-nums}

h1{font-family:var(--f-display);font-weight:800;line-height:.98;letter-spacing:-.03em;text-wrap:balance;margin:0}
.hero{padding-block:30px 26px;display:grid;gap:14px}
.hero h1{font-size:clamp(38px,6.4vw,68px);max-width:14ch}
.lede{color:var(--muted);font-size:clamp(16px,2vw,19px);margin:0;max-width:58ch}

.games{display:grid;gap:24px;grid-template-columns:repeat(3,minmax(0,1fr));padding-block:8px}
.note{--tilt:-1.2deg;position:relative;display:flex;flex-direction:column;gap:10px;text-align:left;border:0;cursor:pointer;color:var(--note-ink);background:var(--c);padding:24px 20px 18px;min-height:230px;border-radius:2px 2px 8px 2px;transform:rotate(var(--tilt));box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease}
.note::before{content:"";position:absolute;inset:0 0 auto;height:24px;background:linear-gradient(rgba(26,29,56,.07),rgba(26,29,56,0));pointer-events:none}
.note:nth-child(2){--tilt:1deg}.note:nth-child(3){--tilt:-.5deg}.note:nth-child(4){--tilt:.8deg}.note:nth-child(5){--tilt:-.9deg}.note:nth-child(6){--tilt:.6deg}
.note:hover{transform:rotate(0) translateY(-4px)}
.note-where{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;opacity:.72}
.note-title{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,3vw,32px);line-height:1.02;letter-spacing:-.02em}
.note-text{font-size:15px;line-height:1.45;max-width:38ch}
.note-meta{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;font-size:13px;font-weight:600}
.note-meta span{background:var(--note-veil);padding:4px 9px;border-radius:99px}
@media (max-width:900px){.games{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.games{grid-template-columns:1fr;gap:20px}.note{min-height:0}}

.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;margin-top:56px;align-items:start}
@media (max-width:820px){.lower{grid-template-columns:1fr}}
.sec-title{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.02em;margin:0;line-height:1.1}
.sec-sub{color:var(--muted);margin:8px 0 0;font-size:15px;max-width:56ch}
.placar{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:16px;min-width:0;scroll-margin-top:16px}
.addp{display:flex;gap:8px}
.addp input{flex:1;min-width:0;font:500 16px var(--f-body);color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px}
.btn-ink{font-weight:700;font-size:15px;background:var(--ink);color:var(--paper);border:0;border-radius:12px;padding:11px 16px;cursor:pointer;white-space:nowrap}
.plist{list-style:none;margin:0;padding:0;display:grid}
.plist li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.plist li:first-child{border-top:0}
.pn-wrap{display:grid;gap:5px;justify-items:start;min-width:0}
.pn{font-weight:600;overflow-wrap:anywhere}
.lead .pn::after{content:"na frente";margin-left:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;background:var(--yellow);color:var(--note-ink);padding:2px 6px;border-radius:4px;vertical-align:2px}
.plvl{font-size:13px;font-weight:600;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:4px 6px;cursor:pointer;max-width:100%}
.pp{display:inline-flex;align-items:center;gap:4px}
.pp b{min-width:3ch;text-align:center;font:800 20px var(--f-display);font-variant-numeric:tabular-nums}
.pp button,.pdel{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:18px;line-height:1;display:grid;place-items:center}
.pdel{border:0;background:none;color:var(--muted)}
.empty{margin:0;color:var(--muted);font-size:15px}
.linkbtn{justify-self:start;background:none;border:0;padding:4px 0;color:var(--muted);font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.inline-link{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.more{display:grid;gap:18px;min-width:0}
.more dl{margin:0;display:grid;gap:14px}
.more dt{font:800 17px/1.2 var(--f-display)}
.more dd{margin:3px 0 0;color:var(--muted);font-size:15px;line-height:1.45}
.foot{margin-top:48px;color:var(--muted);font-size:13px}

.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font-weight:600;font-size:15px;cursor:pointer;padding:10px 0 4px}
.sh{padding-block:10px 26px;display:grid;gap:12px;justify-items:start}
.sh h1{font-size:clamp(40px,7vw,70px)}
.tag{display:inline-block;background:var(--c);color:var(--note-ink);font-size:12px;font-weight:700;line-height:1;text-transform:uppercase;letter-spacing:.1em;padding:7px 10px;border-radius:3px;transform:rotate(-1.5deg)}
.setup-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:36px;align-items:start}
@media (max-width:780px){.setup-grid{grid-template-columns:1fr;gap:28px}}
.howto{background:var(--c);color:var(--note-ink);padding:24px 22px;transform:rotate(-.6deg);box-shadow:var(--shadow);border-radius:2px 2px 8px 2px;display:grid;gap:14px;min-width:0}
.howto h2{font:800 22px/1.1 var(--f-display);margin:0}
.howto ol{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:12px}
.howto li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;line-height:1.45}
.howto li::before{content:counter(s);font-family:var(--f-marker);font-size:22px;line-height:1.05}
.tip{margin:0;padding-top:12px;border-top:2px dashed var(--note-shade);font-size:15px}
.panel{display:grid;gap:26px;min-width:0}
.field{display:grid;gap:10px;min-width:0}
.field-h{font-size:12px;font-weight:700;line-height:1;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0}
.field-note{margin:0;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:15px;line-height:1;padding:10px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
.chip small{font-size:12px;font-weight:500;opacity:.6;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.adult{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.04em;background:var(--bad);color:var(--on-strong);border-radius:4px;padding:3px 4px}
textarea{width:100%;min-height:110px;resize:vertical;font:500 16px/1.45 var(--f-body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;box-sizing:border-box}
.stepper{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:4px;justify-self:start}
.stepper button{width:40px;height:40px;border-radius:50%;border:0;background:var(--paper);font-size:20px;font-weight:700;line-height:1;cursor:pointer}
.stepper output{min-width:3ch;text-align:center;font:800 20px var(--f-display);font-variant-numeric:tabular-nums}
.sample{background:var(--c);color:var(--note-ink);padding:16px 18px;border-radius:2px 2px 8px 2px;box-shadow:var(--shadow);display:grid;gap:6px;max-width:320px;transform:rotate(.6deg)}
.sample-w{font:400 30px/1.05 var(--f-marker)}
.sample-l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--bad)}
.sample-f{font-weight:700}
.start{font:800 21px/1 var(--f-display);letter-spacing:-.01em;background:var(--ink);color:var(--paper);border:0;border-radius:16px;padding:20px 24px;width:100%;cursor:pointer;box-shadow:var(--shadow)}
.start:hover{transform:translateY(-1px)}
.err{color:var(--bad);font-weight:700;margin:0}

.res-head{padding-block:10px 28px;display:grid;gap:10px;justify-items:start}
.res-head h1{font-size:clamp(52px,11vw,104px)}
.res-head p{margin:0;color:var(--muted);font-size:18px}
.res-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px}
@media (max-width:640px){.res-grid{grid-template-columns:1fr}}
.res-grid h2{font:800 20px/1 var(--f-display);margin:0 0 12px;display:flex;gap:8px;align-items:baseline}
.res-grid h2 span{color:var(--muted);font-size:16px;font-variant-numeric:tabular-nums}
.wl{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.wl li{padding:7px 12px;border-radius:999px;font-weight:600;font-size:15px}
.wl.ok li{background:var(--ok-soft)}
.wl.miss li{background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.wl em{font-style:normal;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-left:6px;color:var(--bad)}
.wl .none{background:none!important;border:0!important;padding-left:0;color:var(--muted);font-weight:500}
.standings{margin-top:36px;max-width:460px}
.standings ol{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px;counter-reset:r}
.standings li{counter-increment:r;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.standings li::before{content:counter(r) "º";font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.standings li.me{border-color:var(--ink)}
.standings small{color:var(--muted);font-weight:600;margin-left:6px}
.standings b{font:800 18px var(--f-display);font-variant-numeric:tabular-nums}
.res-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
.res-actions .start{width:auto;flex:1 1 280px}
.btn-line{font-weight:700;font-size:16px;background:transparent;border:1.5px solid var(--line);border-radius:16px;padding:18px 22px;cursor:pointer;flex:0 1 auto}

/* ---------- stage: one full-screen note ---------- */
.stage{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;gap:10px;background:var(--c,var(--yellow));color:var(--note-ink);
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(14px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
.st-top{position:relative;z-index:3;display:flex;align-items:center;gap:12px;min-height:44px}
.st-time{font:800 clamp(28px,6vmin,48px)/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.st-time.hurry{color:var(--bad);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.st-score{margin-left:auto;font-weight:700;font-size:clamp(15px,2.6vmin,19px);line-height:1;background:var(--note-veil);padding:9px 13px;border-radius:99px;font-variant-numeric:tabular-nums}
.st-label{font-size:13px;font-weight:700;line-height:1.2;text-transform:uppercase;letter-spacing:.1em;opacity:.75}
.push{margin-left:auto}
.st-x{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:0;background:var(--note-shade);cursor:pointer}
.st-body{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.st-main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.st-cat{font-size:clamp(12px,2.4vmin,17px);font-weight:700;line-height:1.2;text-transform:uppercase;letter-spacing:.14em;opacity:.7;text-align:center}
.st-wordbox{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.st-word{display:block;width:100%;overflow:hidden;font-family:var(--f-marker);font-weight:400;line-height:1.08;text-align:center;font-size:64px;overflow-wrap:normal;word-break:normal;padding-block:.04em}
.st-forbid{flex:none;align-self:center;width:min(420px,100%);background:var(--note-veil);border-radius:14px;padding:12px 18px 14px}
.st-forbid > span{display:block;font-size:12px;font-weight:700;line-height:1;text-transform:uppercase;letter-spacing:.12em;color:var(--bad);margin-bottom:8px}
.st-forbid ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.st-forbid li{font:800 clamp(18px,3.8vmin,28px)/1.22 var(--f-display)}
.st-forbid li.none{font-weight:600;opacity:.6;font-size:16px}
@media (orientation:landscape){
  .stage[data-mode="proibida"] .st-body{flex-direction:row;align-items:center}
  .stage[data-mode="proibida"] .st-main{align-self:stretch}
  .stage[data-mode="proibida"] .st-forbid{width:min(38%,360px)}
}
.stage[data-mode="qse"] .st-body{pointer-events:none;padding-block:30px}
.zones{position:absolute;inset:0;z-index:0;display:grid;grid-template-rows:1fr 1fr;cursor:pointer}
.zone{display:flex;justify-content:center;font-size:clamp(11px,2vmin,14px);font-weight:700;line-height:1;text-transform:uppercase;letter-spacing:.12em;opacity:.62}
.zone.top{align-items:flex-start;padding-top:calc(max(12px,env(safe-area-inset-top,0px)) + 56px)}
.zone.bot{align-items:flex-end;padding-bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 2px);border-top:2px dashed var(--note-shade)}
.zone:active{background:var(--note-shade)}
.st-actions{position:relative;z-index:3;display:flex;gap:10px}
.act{flex:1;min-height:58px;font:800 clamp(18px,3.4vmin,24px)/1 var(--f-display);border:0;border-radius:16px;padding:14px 10px;cursor:pointer;background:var(--note-shade);color:var(--note-ink)}
.act.ok{flex:1.5;background:var(--ok);color:var(--on-strong)}
.act.bad{background:var(--bad);color:var(--on-strong)}
.act:active{transform:translateY(1px)}
.act:disabled{opacity:.45;cursor:default}
.flash{position:absolute;inset:0;z-index:10;display:grid;place-items:center;font:400 clamp(52px,15vmin,150px)/1 var(--f-marker);color:var(--on-strong);opacity:0;pointer-events:none;transition:opacity .1s ease}
.flash.show{opacity:1}
.flash[data-k="ok"]{background:var(--ok)}.flash[data-k="skip"]{background:var(--skip)}.flash[data-k="bad"]{background:var(--bad)}
.ov{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2.2vmin,16px);text-align:center;background:var(--c,var(--yellow));color:var(--note-ink);padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov-dark{background:var(--note-ink);color:var(--yellow)}
.ov-kicker{font-size:clamp(13px,2.6vmin,18px);font-weight:700;line-height:1.25;text-transform:uppercase;letter-spacing:.12em;margin:0;opacity:.8}
.ov-count{font:400 clamp(120px,42vmin,340px)/.9 var(--f-marker);margin:0}
.ov-big{font:400 clamp(60px,17vmin,150px)/1 var(--f-marker);margin:0;font-variant-numeric:tabular-nums}
.ov-sub{font-size:clamp(15px,2.8vmin,20px);font-weight:500;line-height:1.4;margin:0;max-width:36ch}
.ov-time{font:400 clamp(80px,26vmin,240px)/1 var(--f-marker);margin:0}
.ov-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.cta{font:800 clamp(17px,3vmin,22px)/1.1 var(--f-display);background:var(--note-ink);color:var(--c,var(--yellow));border:0;border-radius:14px;padding:16px 24px;min-height:54px;cursor:pointer}
.cta.ghost{background:transparent;color:var(--note-ink);box-shadow:inset 0 0 0 2px var(--note-ink)}
.note-link{background:none;border:0;color:inherit;font-weight:600;font-size:15px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px}
.st-center{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vmin,20px);text-align:center;overflow:auto;padding-block:8px}
.st-center.scroll{justify-content:flex-start}
.st-inner{margin-block:auto;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.4vmin,18px);width:100%}
.big-name{font:400 clamp(40px,12vmin,110px)/1.05 var(--f-marker);margin:0;overflow-wrap:anywhere;max-width:100%}
.big-msg{font:400 clamp(30px,8vmin,64px)/1.08 var(--f-marker);margin:0;max-width:18ch;text-wrap:balance}
.imp-rules{text-align:left;max-width:40ch;margin:0;padding-left:1.3em;font-size:clamp(15px,2.6vmin,19px);font-weight:500;line-height:1.45;display:grid;gap:6px}

/* Na Medida: a tape-measure ruler from 0 to 100 */
.med{width:min(820px,100%);display:grid;gap:10px}
.poles{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;font:400 clamp(20px,4.6vmin,38px)/1.05 var(--f-marker)}
.poles span:last-child{text-align:right}
.ruler{--rh:clamp(72px,15vmin,108px);position:relative;height:var(--rh);background:var(--ruler-bg);border:2px solid var(--note-ink);border-radius:10px;overflow:hidden}
.scale{position:absolute;top:0;bottom:0;left:11px;right:11px;overflow:hidden}
.tk{position:absolute;top:0;width:2px;height:22%;margin-left:-1px;background:var(--note-ink)}
.tk.major{height:42%}
.band{position:absolute;top:0;bottom:0;animation:bandin .35s ease-out}
.band.b1{background:rgba(26,29,56,.13)}
.band.b2{background:rgba(26,29,56,.26)}
.band.b3{background:var(--note-ink)}
@keyframes bandin{from{opacity:0}to{opacity:1}}
.bl{position:absolute;bottom:6px;transform:translateX(-50%);font:800 clamp(13px,2.4vmin,17px)/1 var(--f-display);color:var(--note-ink)}
.bl.in{color:var(--c,var(--yellow))}
.nums{position:relative;height:16px;margin:0 11px;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;opacity:.7}
.nums span{position:absolute;top:0;transform:translateX(-50%)}
.ruler input[type=range]{-webkit-appearance:none;appearance:none;position:absolute;inset:0;width:100%;height:100%;margin:0;background:transparent;cursor:grab;touch-action:none}
.ruler input[type=range]:disabled{cursor:default}
.ruler input[type=range]::-webkit-slider-runnable-track{height:var(--rh);background:transparent;border:0}
.ruler input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:var(--rh);border-radius:6px;background:var(--skip);box-shadow:inset 0 0 0 3px var(--note-ink)}
.ruler input[type=range]::-moz-range-track{height:var(--rh);background:transparent;border:0}
.ruler input[type=range]::-moz-range-thumb{width:22px;height:var(--rh);border-radius:6px;border:3px solid var(--note-ink);background:var(--skip);box-sizing:border-box}
.ruler input[type=range]:focus-visible{outline:none}
.ruler:focus-within{box-shadow:0 0 0 3px var(--focus)}
.med-result{display:grid;gap:4px;justify-items:center}

/* Stop: the drawn letter in a circle, the categories as paper slips */
.stop-body{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,3vmin,28px);overflow:auto}
@media (orientation:landscape){.stop-body{flex-direction:row}}
.stop-lw{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.stop-letter{width:clamp(120px,36vmin,280px);aspect-ratio:1;max-width:100%;display:grid;place-items:center;border-radius:50%;background:var(--note-veil);font:400 clamp(84px,26vmin,210px)/1 var(--f-marker)}
.stop-letter.land{animation:land .35s ease-out}
@keyframes land{from{transform:scale(1.25)}to{transform:scale(1)}}
.stop-cats{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:min(560px,100%)}
@media (orientation:landscape){.stop-cats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stop-cats li{background:var(--note-veil);border-radius:10px;padding:10px 12px;font-weight:600;font-size:clamp(14px,2.5vmin,18px);line-height:1.2;overflow-wrap:anywhere}
.act.stop-go{font-size:clamp(24px,5vmin,36px);min-height:64px}
.stop-score{width:min(460px,100%);background:var(--note-veil);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.stop-score ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.stop-score li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;text-align:left}
.stop-score .sn{font-weight:700;overflow-wrap:anywhere}
.stop-score b{font:800 20px var(--f-display);font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.stop-btns{display:flex;gap:6px}
.stop-btns button{min-width:44px;height:40px;padding:0 8px;border-radius:10px;border:0;background:var(--note-ink);color:var(--c);font-weight:800;cursor:pointer}
.stop-btns button:last-child{background:transparent;color:var(--note-ink);box-shadow:inset 0 0 0 2px var(--note-ink)}
.stop-used{font-size:14px;opacity:.75}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  .note,.note:hover{transform:none}
}

function tone(freq, dur, type, vol, when){
  if (!S.sound) return; const c = audio(); if (!c) return;
  const t = c.currentTime + (when || 0); const o = c.createOscillator(); const g = c.createGain();

  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.03);
}

/* ---------- Cartas com tempo: Quem Sou Eu, Mímica, Palavra Proibida ---------- */
let R = null;
function buildPool(mode, lvl){
  const map = new Map(); const cfg = S.settings[mode];
  if (mode === 'proibida') {
    PROIBIDA[lvl].concat(cfg.adult ? PROIBIDA18[lvl] : []).forEach(([w, ...f]) => map.set(w, {w, f, cat:'Explique sem dizer'}));
    if (cfg.mine) customCards().forEach(c => { if (!map.has(c.w)) map.set(c.w, {w:c.w, f:c.f, cat:'Minha carta'}); });
  } else {
    cfg.cats.forEach(k => {
      if (k === 'custom') lines(mode).forEach(w => { if (!map.has(w)) map.set(w, {w, cat:'Minhas palavras'}); });
      else if (DECKS[k]) DECKS[k].lv[lvl].forEach(w => { if (!map.has(w)) map.set(w, {w, cat:DECKS[k].label}); });
    });
  }
  return [...map.values()];
}
function makeDeck(key, pool){
  const used = S.used[key] || (S.used[key] = new Set());
  let fresh = pool.filter(c => !used.has(c.w));
  if (fresh.length < Math.min(8, pool.length)) { pool.forEach(c => used.delete(c.w)); fresh = pool.slice(); }
  return shuffle(fresh);
}
const scoreText = n => plural(n, 'ponto', 'pontos');
function stageCardsHTML(mode){
  const m = MODES[mode];
  const actions = m.forehead
    ? '<div class="zones" id="zones"><div class="zone top" data-k="skip">Toque em cima para passar</div><div class="zone bot" data-k="ok">Toque embaixo se acertou</div></div>'
    : `<div class="st-actions"><button class="act" data-act="skip">Pular</button>${mode === 'proibida' ? '<button class="act bad" data-act="bad">Proibida!</button>' : ''}<button class="act ok" data-act="ok">Acertou</button></div>`;
  return `<div class="st-top"><div class="st-time" id="st-time">${R.unlimited ? '0:00' : fmt(R.left)}</div><div class="st-score" id="st-score">${scoreText(0)}</div><button class="st-x" data-act="pause" aria-label="Pausar">${ICON_PAUSE}</button></div>
  <div class="st-body"><div class="st-main"><div class="st-cat" id="st-cat"></div><div class="st-wordbox" id="st-box"><div class="st-word" id="st-word" aria-live="polite"></div></div></div>
  ${mode === 'proibida' ? '<div class="st-forbid"><span>Não pode dizer</span><ul id="st-flist"></ul></div>' : ''}</div>
  ${actions}
  <div class="flash" id="flash" aria-hidden="true"></div>
  <div class="ov" id="ov" hidden></div>`;
}
function startCards(mode){
  const lvl = roundLevel(mode);
  const pool = buildPool(mode, lvl);
  if (!pool.length) { showErr(mode === 'proibida' ? 'Não há cartas neste nível.' : 'Escolha pelo menos uma categoria.'); return; }
  audio();
  const cfg = S.settings[mode];
  const unlimited = mode === 'qse' && cfg.time === 0;
  R = {mode, pool, lvl, mult:LV_MULT[lvl], deck:makeDeck(mode, pool), i:-1, card:null, answered:false, lock:false, results:[], score:0,
    unlimited, left:cfg.time * 1000, base:0, t0:0, endAt:0, phase:'count', pausedFrom:null, player:cfg.player, timer:null, cd:null, lastTick:null};
  openStage(mode); stage.innerHTML = stageCardsHTML(mode); keepAwake();
  countdown(beginPlay);
}
function countdown(after){
  const ov = $('#ov', stage);
  const head = R.mode === 'qse' ? ['Celular na testa!', 'Tela virada para os amigos'] : R.mode === 'mimica' ? ['Prepare a mímica', 'Não mostre a tela para o seu time'] : ['Prepare as dicas', 'Alguém do outro time vigia as proibidas'];
  let n = 3; R.phase = 'count';
  const step = () => {

    ov.className = 'ov'; ov.innerHTML = `<p class="ov-kicker">${head[0]}</p><p class="ov-count">${n}</p><p class="ov-sub">${head[1]} · nível ${LV_NAME[R.lvl]}</p>`; ov.hidden = false;
    SFX.count(); n--; R.cd = setTimeout(step, 1000);

}
function beginPlay(){
  if (!R) return; R.phase = 'play';

}
function nextCard(){
  R.i++; if (R.i >= R.deck.length) { R.deck = makeDeck(R.mode, R.pool); R.i = 0; }
  R.card = R.deck[R.i]; R.answered = false; S.used[R.mode].add(R.card.w);
  $('#st-cat', stage).textContent = `${R.card.cat} · ${LV_NAME[R.lvl]}`;
  $('#st-word', stage).textContent = R.card.w;
  const fl = $('#st-flist', stage); if (fl) fl.innerHTML = R.card.f.length ? R.card.f.map(x => `<li>${esc(x)}</li>`).join('') : '<li class="none">Nenhuma nesta carta</li>';

}
function fitWord(){
  const box = $('#st-box', stage), w = $('#st-word', stage); if (!box || !w) return;
  const H = box.clientHeight, W = box.clientWidth; if (!H || !W) return;
  let lo = 14, hi = Math.min(H * 0.96, 280), best = lo;
  for (let i = 0; i < 13; i++) { const mid = (lo + hi) / 2; w.style.fontSize = mid + 'px'; if (w.scrollWidth <= W + 1 && w.scrollHeight <= H) { best = mid; lo = mid; } else hi = mid; }
  w.style.fontSize = Math.floor(best) + 'px';
}
function runTimer(){ clearInterval(R.timer); R.timer = setInterval(tick, 100); tick(); }
function tick(){
  if (!R || R.phase !== 'play') return;
  const el = $('#st-time', stage);
  if (R.unlimited) { el.textContent = fmtUp(R.base + performance.now() - R.t0); return; }
  R.left = Math.max(0, R.endAt - performance.now());
  el.textContent = fmt(R.left);
  const s = Math.ceil(R.left / 1000); el.classList.toggle('hurry', s <= 5);
  if (s <= 5 && s > 0 && s !== R.lastTick) { R.lastTick = s; SFX.tick(); }
  if (R.left <= 0) endRound(false);
}
function answer(k){
  if (!R || R.phase !== 'play' || R.lock || !R.card || R.answered) return;
  R.answered = true; R.lock = true;
  R.results.push({w:R.card.w, r:k});
  if (k === 'ok') R.score++; else if (k === 'bad') R.score--;
  $('#st-score', stage).textContent = scoreText(R.score * R.mult);
  SFX[k](); buzz(k === 'ok' ? 60 : k === 'bad' ? [80, 50, 80] : 30);
  const f = $('#flash', stage); f.dataset.k = k; f.textContent = k === 'ok' ? 'Acertou!' : k === 'bad' ? 'Proibida!' : 'Passou'; f.classList.add('show');
  setTimeout(() => { if (R && R.phase === 'play' && R.answered) nextCard(); }, 300);
  setTimeout(() => { f.classList.remove('show'); if (R) R.lock = false; }, 480);
}
function pause(){
  if (!R) return;
  if (R.phase === 'play') {
    clearInterval(R.timer);
    if (R.unlimited) R.base += performance.now() - R.t0; else R.left = Math.max(0, R.endAt - performance.now());
    R.pausedFrom = 'play';
  } else if (R.phase === 'count') { clearTimeout(R.cd); R.pausedFrom = 'count'; }
  else return;
  R.phase = 'pause';
  const ov = $('#ov', stage); ov.className = 'ov';
  ov.innerHTML = `<p class="ov-kicker">Pausado</p><p class="ov-big">${R.unlimited ? fmtUp(R.base) : fmt(R.left)}</p><p class="ov-sub">${scoreText(R.score * R.mult)} até agora.</p>

  <button class="note-link" data-act="quit">Sair sem contar pontos</button>`;
  ov.hidden = false;
}
function resume(){

  if (R.pausedFrom === 'count') { countdown(beginPlay); return; }
  $('#ov', stage).hidden = true; beginPlay();
}
function endRound(manual){
  if (!R || R.phase === 'over') return;
  clearInterval(R.timer); clearTimeout(R.cd);
  R.phase = 'over';
  if (R.card && !R.answered) R.results.push({w:R.card.w, r:manual ? 'open' : 'time'});
  const score = R.score * R.mult;
  LAST = {mode:R.mode, results:R.results, raw:R.score, mult:R.mult, lvl:R.lvl, score, player:R.player};

}
function finishRound(){ R = null; closeStage(); renderResults(); window.scrollTo(0, 0); }

/* ---------- Impostor ---------- */
let I = null;
function startImpostor(){

  const named = S.players.length >= 3;
  const names = named ? S.players.map(p => p.name) : Array.from({length:cfg.n}, (_, i) => `Jogador ${i + 1}`);
  const n = names.length; const imps = cfg.imps === 2 && n >= 6 ? 2 : 1;

  else (cfg.cat === 'mix' ? IMP_DECKS.filter(k => !DECKS[k].adult) : [cfg.cat]).forEach(k => DECKS[k].lv[lvl].forEach(w => pool.push({w, cat:DECKS[k].label})));

  const card = makeDeck('impostor', pool)[0]; S.used.impostor.add(card.w);

}

  } else if (I.phase === 'show') {

      : `<p class="ov-kicker">${esc(name)}, a palavra secreta é</p><p class="big-name">${esc(I.w)}</p><p class="ov-sub">Categoria: ${esc(I.cat)}. Não deixe ninguém ver.</p>`;
    body += `<button class="cta" data-act="imp-hide">${I.turn < I.names.length - 1 ? 'Vi, esconder e passar' : 'Vi, esconder'}</button>`;

  } else {

    body = `<p class="ov-kicker">${I.imp.size > 1 ? 'Os impostores eram' : 'O impostor era'}</p><p class="big-name">${list}</p><p class="ov-sub">A palavra secreta era <b>${esc(I.w)}</b> (${esc(I.cat)}${I.cat === 'Minhas palavras' ? '' : ' · ' + LV_NAME[I.lvl]}).</p>

function impWin(who){
  if (!I || !I.ids || I.scored) return;
  const mult = LV_MULT[I.lvl];
  if (who === 'group') {
    I.ids.forEach((id, i) => { if (!I.imp.has(i)) { const p = playerById(id); if (p) p.pts += mult; } });
    I.scored = `+${mult} para cada um que não era impostor.`;
  } else {
    const names = [];
    I.ids.forEach((id, i) => { if (I.imp.has(i)) { const p = playerById(id); if (p) { p.pts += 3 * mult; names.push(p.name); } } });

  }
  save(); SFX.win(); renderImp();
}

function medNext(){

function rulerHTML(mode){
  const t = M.target; const [r1, r2, r3] = BANDS[M.lvl]; const show = mode !== 'guess';
  let ticks = ''; for (let i = 0; i <= 20; i++) ticks += `<i class="tk${i % 2 ? '' : ' major'}" style="left:${i * 5}%"></i>`;
  let nums = ''; for (let v = 0; v <= 100; v += 10) nums += `<span style="left:${v}%">${v}</span>`;
  const band = (r, cls) => `<b class="band ${cls}" style="left:${t - r}%;width:${2 * r}%"></b>`;
  const a = (r1 + r2) / 2, b = (r2 + r3) / 2;
  const bands = show ? band(r3, 'b1') + band(r2, 'b2') + band(r1, 'b3')
    + `<span class="bl in" style="left:${t}%">3</span><span class="bl" style="left:${t - a}%">2</span><span class="bl" style="left:${t + a}%">2</span><span class="bl" style="left:${t - b}%">1</span><span class="bl" style="left:${t + b}%">1</span>` : '';
  const input = mode === 'clue' ? '' : `<input type="range" id="med-guess" min="0" max="100" step="1" value="${M.guess}" aria-label="Palpite entre ${esc(M.card.l)} e ${esc(M.card.r)}"${mode === 'reveal' ? ' disabled' : ''}>`;
  return `<div class="med"><div class="poles"><span>← ${esc(M.card.l)}</span><span>${esc(M.card.r)} →</span></div>
  <div class="ruler"><div class="scale">${bands}${ticks}</div>${input}</div><div class="nums" aria-hidden="true">${nums}</div></div>`;
}
function renderMed(){
  const p = playerById(M.player); let body = '';
  const who = `${p ? ' · vez de ' + esc(p.name) : ''} · ${LV_NAME[M.lvl]}`;
  if (M.phase === 'secret') {
    body = `<p class="ov-kicker">Carta ${M.cards + 1}${who}</p><p class="big-msg">Só quem dá a dica olha a próxima tela</p><p class="ov-sub">O resto da roda vira o rosto por um instante.</p><button class="cta" data-act="med-show">Sou eu, mostrar o alvo</button>`;
  } else if (M.phase === 'clue') {
    body = `<p class="ov-kicker">Seu alvo está no ${M.target}</p>${rulerHTML('clue')}<p class="ov-sub">Pense numa coisa que fica bem nesse ponto entre <b>${esc(M.card.l)}</b> e <b>${esc(M.card.r)}</b> e diga em voz alta. Números não valem.</p><button class="cta" data-act="med-hide">Esconder e passar o celular</button>`;
  } else if (M.phase === 'guess') {
    body = `<p class="ov-kicker">Onde está o alvo?</p>${rulerHTML('guess')}<p class="ov-sub">Conversem e arrastem o marcador laranja. Quem deu a dica não pode ajudar.</p><button class="cta" data-act="med-lock">Travar palpite e revelar</button>`;
  } else {
    const label = ['Passou longe', 'Raspou', 'Pertinho!', 'Na mosca!'][M.raw];
    const nx = nextPlayer(M.player);
    body = `<div class="med-result"><p class="ov-kicker">Alvo no ${M.target}, palpite no ${M.guess}</p><p class="big-msg">${label}</p></div>${rulerHTML('reveal')}
    <p class="ov-sub">${M.raw} × ${LV_MULT[M.lvl]} (${LV_NAME[M.lvl]}) = ${plural(M.pts, 'ponto', 'pontos')}${p ? ` para ${esc(p.name)}` : ''}. Total desta sessão: ${M.total}.</p>
    <div class="ov-btns"><button class="cta" data-act="med-next">Próxima carta${nx ? ': ' + esc(nx.name) : ''}</button><button class="cta ghost" data-act="med-quit">Voltar</button></div>`;
  }
  M.lockUntil = performance.now() + 700;
  stage.innerHTML = `<div class="st-top"><span class="st-label">Na Medida</span><button class="st-x push" data-act="med-quit" aria-label="Sair do Na Medida">${ICON_X}</button></div><div class="st-center scroll"><div class="st-inner">${body}</div></div>`;
}
function medLock(){
  const d = Math.abs(M.guess - M.target); const [r1, r2, r3] = BANDS[M.lvl];
  M.raw = d <= r1 ? 3 : d <= r2 ? 2 : d <= r3 ? 1 : 0;
  M.pts = M.raw * LV_MULT[M.lvl];
  M.total += M.pts; M.cards++;
  const p = playerById(M.player); if (p && M.pts) { p.pts += M.pts; save(); }
  M.phase = 'reveal'; renderMed();
  if (M.raw >= 2) { SFX.win(); buzz(80); } else if (M.raw === 1) SFX.ok(); else SFX.skip();
}

/* ---------- Stop ---------- */
let A = null;
function stopCats(){ return S.settings.stop.cats.map(k => STOP_CATS[k].label).concat(lines('stop').slice(0, 12)); }
function startStop(){
  if (!stopCats().length) { showErr('Escolha pelo menos uma categoria.'); return; }
  const cfg = S.settings.stop;
  audio(); A = {phase:'roll', letter:'?', lvl:cfg.level, limit:cfg.time * 1000, start:0, timer:null, roll:null, lastTick:null, timeUp:false, finalText:''};
  openStage('stop'); keepAwake(); stopRound();
}
function stopRound(){
  clearInterval(A.timer); clearInterval(A.roll);
  const pool = STOP_LETTERS[A.lvl].split(''); let avail = pool.filter(c => !S.usedLetters.has(c));
  if (!avail.length) { pool.forEach(c => S.usedLetters.delete(c)); avail = pool.slice(); }
  const final = pick(avail); S.usedLetters.add(final);
  A.phase = 'roll'; A.letter = '?'; A.lastTick = null; A.timeUp = false; renderStop();
  const el = $('#stop-letter', stage); let t = 0;
  A.roll = setInterval(() => {
    if (!A) return;
    t += 80; el.textContent = pick(pool); SFX.tick();
    if (t >= 1200) {
      clearInterval(A.roll); A.letter = final; el.textContent = final; el.classList.add('land'); SFX.go(); buzz(120);
      A.phase = 'play'; A.start = performance.now(); $('#stop-btn', stage).disabled = false;
      A.timer = setInterval(stopTick, 200); stopTick();
    }
  }, 80);
}
function stopTick(){
  if (!A || A.phase !== 'play') return;
  const el = $('#stop-time', stage); const elapsed = performance.now() - A.start;
  if (A.limit) {
    const left = Math.max(0, A.limit - elapsed); el.textContent = fmt(left);
    const s = Math.ceil(left / 1000); el.classList.toggle('hurry', s <= 10);
    if (s <= 5 && s > 0 && s !== A.lastTick) { A.lastTick = s; SFX.tick(); }
    if (left <= 0) stopEnd(true);
  } else el.textContent = fmtUp(elapsed);
}
function stopEnd(timeUp){
  if (!A || A.phase !== 'play') return;
  clearInterval(A.timer); A.finalText = $('#stop-time', stage).textContent;
  A.phase = 'over'; A.timeUp = timeUp; SFX.end(); buzz([200, 80, 200]); renderStop();
}
function renderStop(){
  const timeText = A.phase === 'over' ? A.finalText : (A.limit ? fmt(A.limit) : '0:00');
  const top = `<div class="st-top"><div class="st-time" id="stop-time">${timeText}</div><span class="st-label push">Stop · ${LV_NAME[A.lvl]}</span><button class="st-x" data-act="stop-quit" aria-label="Sair do Stop">${ICON_X}</button></div>`;
  if (A.phase !== 'over') {
    stage.innerHTML = top + `<div class="stop-body"><div class="stop-lw"><span class="st-cat">Letra</span><div class="stop-letter" id="stop-letter" aria-live="polite">${A.letter}</div></div>
    <ul class="stop-cats">${stopCats().map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>
    <div class="st-actions"><button class="act bad stop-go" id="stop-btn" data-act="stop-stop"${A.phase === 'play' ? '' : ' disabled'}>Stop!</button></div>`;
    return;
  }
  const k = LV_MULT[A.lvl];
  const rows = S.players.length ? `<div class="stop-score"><p class="ov-kicker">Somem os pontos desta letra (×${k})</p><ul>${S.players.map(p => `<li><span class="sn">${esc(p.name)}</span><b>${p.pts}</b><span class="stop-btns"><button data-act="pts" data-id="${p.id}" data-d="${5 * k}" aria-label="Dar ${5 * k} pontos para ${esc(p.name)}">+${5 * k}</button><button data-act="pts" data-id="${p.id}" data-d="${10 * k}" aria-label="Dar ${10 * k} pontos para ${esc(p.name)}">+${10 * k}</button><button data-act="pts" data-id="${p.id}" data-d="${-5 * k}" aria-label="Tirar ${5 * k} pontos de ${esc(p.name)}">−${5 * k}</button></span></li>`).join('')}</ul></div>` : '';
  stage.innerHTML = top + `<div class="st-center scroll"><div class="st-inner">
    <p class="ov-kicker">Letra ${A.letter}</p><p class="big-name">${A.timeUp ? 'Tempo!' : 'Stop!'}</p>
    <p class="ov-sub">Canetas para baixo. Leiam as respostas categoria por categoria: 10 pontos se só você escreveu, 5 se alguém repetiu, 0 se ficou em branco.</p>
    ${rows}
    <div class="ov-btns"><button class="cta" data-act="stop-next">Sortear outra letra</button><button class="cta ghost" data-act="stop-quit">Voltar</button></div>
    <p class="ov-sub stop-used">Letras já sorteadas: ${[...S.usedLetters].join(' · ')}</p></div></div>`;
}
function stopQuit(){ if (A) { clearInterval(A.timer); clearInterval(A.roll); } A = null; closeStage(); renderSetup('stop'); }

/* ================= Eventos ================= */
function startCurrent(){
  const kind = MODES[S.mode].kind;
  if (kind === 'cards') startCards(S.mode); else if (kind === 'impostor') startImpostor(); else if (kind === 'medida') startMedida(); else startStop();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const a = t.dataset.act, v = t.dataset.v; const cfg = S.mode ? S.settings[S.mode] : null;
  /* ignora toque duplo logo depois de trocar de tela, para ninguém ver a tela secreta da próxima pessoa */
  if (/^(imp-|med-)/.test(a) && !/-quit$/.test(a)) { const g = a.startsWith('imp') ? I : M; if (!g || performance.now() < (g.lockUntil || 0)) return; }
  switch (a) {
    case 'home': renderHome(); window.scrollTo(0, 0); break;
    case 'open': renderSetup(t.dataset.mode); window.scrollTo(0, 0); break;
    case 'setup': renderSetup(S.mode); window.scrollTo(0, 0); break;
    case 'sound': S.sound = !S.sound; save(); refreshTopbar(); if (S.sound) { audio(); SFX.ok(); } break;
    case 'goto-placar': {
      if (S.view !== 'home') renderHome();
      const el = $('#placar'); if (el) { el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'}); const inp = $('#pname'); if (inp) inp.focus({preventScroll:true}); }
      break;
    }
    case 'cat':
      if (S.mode === 'impostor') cfg.cat = v;
      else { const i = cfg.cats.indexOf(v); if (i >= 0) cfg.cats.splice(i, 1); else cfg.cats.push(v); }
      save(); rerenderFields(); break;
    case 'lvl': setRoundLevel(S.mode, v); save(); rerenderFields(); break;
    case 'time': cfg.time = Number(v); save(); rerenderFields(); break;
    case 'player': cfg.player = v || null; save(); rerenderFields(); break;
    case 'adult': cfg.adult = v === '1'; save(); rerenderFields(); break;
    case 'mine': cfg.mine = v === '1'; save(); rerenderFields(); break;
    case 'imps': cfg.imps = Number(v); save(); rerenderFields(); break;
    case 'hint': cfg.hint = v === '1'; save(); rerenderFields(); break;
    case 'npl': cfg.n = Math.min(20, Math.max(3, cfg.n + Number(t.dataset.d))); save(); rerenderFields(); break;
    case 'start': startCurrent(); break;
    case 'again': { const c = S.settings[S.mode]; const nx = nextPlayer(c.player); if (nx) c.player = nx.id; save(); startCards(S.mode); break; }
    case 'pts': { const p = playerById(t.dataset.id); if (p) { p.pts += Number(t.dataset.d); save(); refreshPlacar(); if (A && A.phase === 'over') renderStop(); } break; }
    case 'del-player': S.players = S.players.filter(p => p.id !== t.dataset.id); save(); refreshPlacar(); break;
    case 'reset-pts':
      if (t.dataset.armed) { S.players.forEach(p => { p.pts = 0; }); save(); refreshPlacar(); }
      else { t.dataset.armed = '1'; t.textContent = 'Toque de novo para zerar todos os pontos'; setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.textContent = 'Zerar pontos'; } }, 3000); }
      break;
    /* cartas */
    case 'ok': case 'skip': case 'bad': answer(a); break;
    case 'pause': pause(); break;
    case 'resume': resume(); break;
    case 'end': endRound(true); break;
    case 'quit': quitRound(); break;
    /* impostor */
    case 'imp-reveal': I.phase = 'show'; renderImp(); break;
    case 'imp-hide': if (I.turn < I.names.length - 1) { I.turn++; I.phase = 'pass'; } else { I.phase = 'talk'; SFX.go(); } renderImp(); break;
    case 'imp-ask':
      if (!I.confirm) { I.confirm = true; renderImp(); clearTimeout(I.confirmT); I.confirmT = setTimeout(() => { if (I && I.phase === 'talk' && I.confirm) { I.confirm = false; renderImp(); } }, 3000); }
      else { clearTimeout(I.confirmT); I.phase = 'reveal'; SFX.end(); buzz([120, 60, 120]); renderImp(); }
      break;
    case 'imp-win': impWin(v); break;
    case 'imp-again': startImpostor(); break;
    case 'imp-quit': if (I) clearTimeout(I.confirmT); I = null; closeStage(); renderSetup('impostor'); break;
    /* na medida */
    case 'med-show': M.phase = 'clue'; renderMed(); break;
    case 'med-hide': M.phase = 'guess'; renderMed(); break;
    case 'med-lock': medLock(); break;
    case 'med-next': { const nx = nextPlayer(M.player); if (nx) { M.player = nx.id; S.settings.medida.player = nx.id; save(); } medNext(); break; }
    case 'med-quit': M = null; closeStage(); renderSetup('medida'); break;
    /* stop */
    case 'stop-stop': stopEnd(false); break;
    case 'stop-next': stopRound(); break;
    case 'stop-quit': stopQuit(); break;
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'med-guess' && M) { M.guess = Number(el.value); return; }
  if (el.matches && el.matches('textarea[data-custom]')) {
    const mode = el.dataset.custom; const before = customCount(mode);
    S.custom[mode] = el.value; const after = customCount(mode);
    const cfg = S.settings[mode];
    if (mode === 'qse' || mode === 'mimica') { const i = cfg.cats.indexOf('custom'); if (after && !before && i < 0) cfg.cats.push('custom'); if (!after && i >= 0) cfg.cats.splice(i, 1); }
    else if (mode === 'impostor') { if (after && !before) cfg.cat = 'custom'; if (!after && cfg.cat === 'custom') cfg.cat = 'mix'; }
    else if (mode === 'proibida' || mode === 'medida') { if (after && !before) cfg.mine = true; }
    saveSoon();
    const cats = $('#chips-cats'); if (cats) cats.innerHTML = catChips(mode);
    const deck = $('#chips-deck'); if (deck) deck.innerHTML = deckChips(mode);
    const note = $('#custom-count'); if (note) note.textContent = customNote(mode);
    const mix = $('#mix-note'); if (mix) mix.hidden = S.settings.impostor.cat !== 'mix';
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches && el.matches('select[data-plvl]')) { const p = playerById(el.dataset.plvl); if (p && LV.includes(el.value)) { p.lvl = el.value; save(); } }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'addp') return;
  e.preventDefault();
  const inp = $('#pname'); const name = inp.value.trim().slice(0, 24); if (!name) return;
  if (S.players.length >= 20) { inp.value = ''; inp.placeholder = 'Limite de 20 nomes'; return; }
  S.players.push({id:uid(), name, pts:0, lvl:'f'}); save(); inp.value = ''; refreshPlacar(); inp.focus();
});
document.addEventListener('keydown', e => {
  if (stage.hidden || !R) return;
  if (e.key === 'Escape') { e.preventDefault(); if (R.phase === 'pause') resume(); else pause(); return; }
  if (R.phase !== 'play') return;
  if (e.key === 'Enter' || e.key === 'ArrowDown') { e.preventDefault(); answer('ok'); }
  else if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); answer('skip'); }
  else if ((e.key === 'x' || e.key === 'X') && R.mode === 'proibida') answer('bad');
});
document.addEventListener('visibilitychange', () => { if (document.hidden && R && (R.phase === 'play' || R.phase === 'count')) pause(); });
window.addEventListener('resize', () => { if (R) fitWord(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (R) fitWord(); });

renderHome();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
}
</script>
